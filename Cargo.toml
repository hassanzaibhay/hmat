[workspace]
members = ["hmatc"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hassan Zaib Hayat <hassanzaibhayatske@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hassanzaibhayat/hmat"

[workspace.dependencies]
logos = "0.14"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
